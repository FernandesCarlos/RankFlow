services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rankflow
      POSTGRES_USER: rankflow
      POSTGRES_PASSWORD: rankflow_dev
    ports:
      - "5432:5432"
    volumes:
      - rankflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankflow -d rankflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/RankFlow.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RankFlow: Host=postgres;Port=5432;Database=rankflow;Username=rankflow;Password=rankflow_dev
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rankflow_postgres:
